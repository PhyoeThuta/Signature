steps:
  # Step 1: Build Backend Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/signature-backend:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/signature-backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - './backend'

  # Step 2: Build Frontend Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/signature-frontend:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/signature-frontend:latest'
      - '-f'
      - 'frontend/Dockerfile'
      - './frontend'

  # Step 3: Push Backend Image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/signature-backend:$SHORT_SHA'

  # Step 4: Push Frontend Image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/signature-frontend:$SHORT_SHA'

  # Step 5: Update Kubernetes Backend Deployment
  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'deploy-backend'
    args:
      - 'set'
      - 'image'
      - 'deployment/backend'
      - 'backend=gcr.io/$PROJECT_ID/signature-backend:$SHORT_SHA'
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=us-central1-a'
      - 'CLOUDSDK_CONTAINER_CLUSTER=signature-app-cluster'
      - 'CLOUDSDK_COMPUTE_REGION=us-central1'

  # Step 6: Update Kubernetes Frontend Deployment
  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'deploy-frontend'
    args:
      - 'set'
      - 'image'
      - 'deployment/frontend'
      - 'frontend=gcr.io/$PROJECT_ID/signature-frontend:$SHORT_SHA'
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=us-central1-a'
      - 'CLOUDSDK_CONTAINER_CLUSTER=signature-app-cluster'
      - 'CLOUDSDK_COMPUTE_REGION=us-central1'

  # Step 7: Verify Deployment
  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'verify-deployment'
    args:
      - 'rollout'
      - 'status'
      - 'deployment/backend'
      - '-n'
      - 'signature-app'
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=us-central1-a'
      - 'CLOUDSDK_CONTAINER_CLUSTER=signature-app-cluster'
      - 'CLOUDSDK_COMPUTE_REGION=us-central1'

# Images to push to Container Registry
images:
  - 'gcr.io/$PROJECT_ID/signature-backend:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/signature-frontend:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/signature-backend:latest'
  - 'gcr.io/$PROJECT_ID/signature-frontend:latest'

# Timeout
timeout: '1800s'

# Options
options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  
# Build trigger configuration (save this in your repo as cloudbuild.yaml)
# Trigger on push to main branch
onFailure:
  - NOTIFY
