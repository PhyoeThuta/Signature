apiVersion: v1
kind: Namespace
metadata:
  name: signature-app
  labels:
    name: signature-app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: signature-app-config
  namespace: signature-app
data:
  DATABASE_URL: "mysql+mysqlconnector://signature_user:signature_pass@mysql-service:3306/signature_db"
  FLASK_ENV: "production"
  CORS_ORIGINS: "*"
---
apiVersion: v1
kind: Secret
metadata:
  name: signature-app-secret
  namespace: signature-app
type: Opaque
stringData:
  SECRET_KEY: "your-secret-key-change-in-production"
  MYSQL_ROOT_PASSWORD: "root123"
  MYSQL_PASSWORD: "signature_pass"
