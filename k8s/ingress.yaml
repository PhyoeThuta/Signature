apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: signature-app-ingress
  namespace: signature-app
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "signature-app-ip"
    networking.gke.io/managed-certificates: "signature-app-cert"
spec:
  rules:
  - host: your-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 5000
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: signature-app-cert
  namespace: signature-app
spec:
  domains:
  - your-domain.com
  - www.your-domain.com
